# cvflow configuration — copy to config.yaml and fill in. NEVER commit config.yaml.
# All secrets live here (gitignored), not in code.

telegram:
  bot_token: ""            # from @BotFather
  authorized_user_id: 0    # your numeric Telegram user ID — the ONLY user the bot obeys

schedule:
  daily_discovery_time: "12:00"   # HH:MM, server local time — when Goal 1 runs
  timezone: "Asia/Kolkata"
  heartbeat_interval_minutes: 360 # how often to confirm "I'm alive" to you (Goal 10)

discovery:
  # Apply broadly — any role whose JD-listed skills the user matches. Ranking (Goal 1)
  # filters by actual skill fit, not by title, so cast a wide net here.
  search_terms: ["devops engineer", "go developer", "golang", "python developer", "linux administrator", "site reliability engineer", "network engineer", "backend engineer", "platform engineer"]
  locations: ["Remote", "India"]
  sites: ["linkedin", "indeed", "google", "naukri"]  # JobSpy sites (naukri = India-native, INR salary + experience_range)
  results_wanted_per_site: 25     # throttle to respect free scraping limits
  hours_old: 72                   # only postings newer than this
  country_indeed: "india"         # pin Indeed/Naukri to a country (Phase 14A)
  linkedin_fetch_description: true  # fetch full LinkedIn JD text so distillation has content
  max_distill_per_cohort: 400     # total distill cap per run (Mistral fast + cached); raise for volume
  top_n_per_cohort: 5             # how many ranked jobs to show per M/N section
  reconsider_discovered: false    # TESTING: set true to re-rank already-shown (un-applied)
                                  # jobs each run instead of dedup'ing them; false in production
  log_dir: "logs/discover"        # full digest + drops written here every run
  summarize_drops: true           # manual /discover only: LLM-summarize the drop log
  drop_summary_provider: "tailoring"  # which llm.* block to use; tailoring=Cerebras
  drop_summary_max_chars: 700     # max chars of drop summary fed back in the Telegram message
  drop_summary_samples_per_bucket: 3  # examples per bucket fed to the LLM summarizer
  cron_sends_drops: false         # daily cron sends digest only by default (no drop detail)

preferences:
  yoe_have: 1
  min_ctc_lpa: 7
  exclude_title_keywords: ["senior", "sr.", "lead", "principal", "staff", "manager", "architect", "head", "director", "vp"]
  yoe_buffer: 2                   # tolerance above stated YOE before excluding
  top_ctc_lpa: 40                 # comp-score top anchor (LPA)
  fit_weight: 0.70               # M-cohort blend: weight on LLM fit (must sum with comp to 1.0)
  comp_weight: 0.30              # M-cohort blend: weight on coded comp score
  prefer_roles:                  # role-family preference weights rendered into the fit prompt
    devops: 1.0
    sre: 1.0
    platform: 1.0
    infra: 1.0
    backend: 0.8
    fullstack: 0.6
    network: 0.6
    sysadmin: 0.6
    data: 0.4
    frontend: 0.3
    security: 0.5
    other: 0.2
  exclude_when:                  # declarative deal-breakers over crux fields (drop on ANY match)
    - {field: night_shift_only, equals: true}
    - {field: app_maintenance_focus, equals: true}
    - {field: seniority_signal, contains_any: ["senior", "lead"]}  # too senior for a junior
    - {field: min_years_required, greater_than: 3}
    - {field: country, equals: "other"}   # drop foreign-onsite (keeps india + global-remote)
    - {field: red_flags, contains_any: ["unpaid", "commission_only", "scam"]}

llm:
  # BRAIN = Mistral mistral-small-2506. Two roles: (1) the Hermes agent brain — reasoning +
  # tool calls — set in ~/.hermes/config.yaml (model.default=mistral-small-2506, provider=custom,
  # base_url=api.mistral.ai) with MISTRAL_API_KEY in ~/.hermes/.env; (2) cvflow's own analyze_jd
  # + weekly learn calls, which read THIS block. Use the SAME Mistral key as distillation below.
  # (Replaced NVIDIA NIM llama-3.3-70b — free-tier latency hit 2–9 min/turn, unusable.)
  brain:
    provider: "mistral"
    api_key: ""                     # console.mistral.ai key — same as distillation
    base_url: "https://api.mistral.ai/v1"
    model: "mistral-small-2506"     # fast, native tool-calling, 128k ctx, ~300 RPM free tier
    max_requests_per_minute: 300
  # DISTILLATION = lightweight high-volume JD->Crux structured extraction (Phase 14B).
  # Any OpenAI-compatible provider; default Mistral mistral-small (strict JSON, high TPM).
  distillation:
    provider: "mistral"
    api_key: ""                     # console.mistral.ai key
    base_url: "https://api.mistral.ai/v1"
    model: "mistral-small-2506"
    max_requests_per_minute: 300    # 5 RPS free tier
  # TAILORING = low-volume, high-quality resume tailoring. Cerebras gpt-oss-120b (65k ctx).
  tailoring:
    provider: "cerebras"
    api_key: ""                     # cloud.cerebras.ai key (csk-...)
    base_url: "https://api.cerebras.ai/v1"
    model: "gpt-oss-120b"
    max_requests_per_minute: 5      # free tier: 5 RPM / 2400 per day
  # PRIVACY: free tiers may train on submitted data (incl. your PII). See CLAUDE.md.

resume:
  master_tex_path: "resume/master.tex"   # your modular master LaTeX resume
  output_dir: "data/resumes"             # compiled tailored PDFs land here
  latex_compiler: "tectonic"             # locked decision; resume/ shells to tectonic regardless

automation:
  headless: false                 # run headed under xvfb on the server
  use_stealth: true
  storage_state_dir: "data/auth_state"   # Playwright persistent context (cookies/session)
  form_timeout_minutes: 10

auth:
  google_account_email: ""        # designated (ideally BURNER) Google account for OAuth
  application_email: ""           # email used for OTP-based registration/login
  otp_timeout_minutes: 15         # Goal 7 default

storage:
  db_path: "data/cvflow.db"               # SQLite application-tracking store (Goal 9)
  form_fields_path: "profile/form_fields.json"

security:
  fernet_key_path: "data/.fernet_key"     # encryption key for tokens/cookies; chmod 600, never commit

profile:
  knowledge_base_dir: "profile"   # all *.md loaded in full as LLM context
