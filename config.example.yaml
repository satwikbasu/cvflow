# cvflow configuration — copy to config.yaml and fill in. NEVER commit config.yaml.
# All secrets live here (gitignored), not in code.

telegram:
  bot_token: ""            # from @BotFather
  authorized_user_id: 0    # your numeric Telegram user ID — the ONLY user the bot obeys

schedule:
  daily_discovery_time: "08:00"   # HH:MM, server local time — when Goal 1 runs
  timezone: "America/New_York"
  heartbeat_interval_minutes: 360 # how often to confirm "I'm alive" to you (Goal 10)

discovery:
  search_terms: ["software engineer", "backend engineer"]  # roles to search
  locations: ["Remote", "New York, NY"]
  sites: ["linkedin", "indeed", "glassdoor", "google", "zip_recruiter"]  # JobSpy sites
  results_wanted_per_site: 25     # throttle to respect free scraping limits
  hours_old: 72                   # only postings newer than this
  top_n_to_present: 8             # 5–10: how many ranked jobs to show daily (Goal 1)

llm:
  provider: "gemini"
  api_key: ""                     # Google AI Studio free-tier key
  model: "gemini-2.5-flash"
  max_requests_per_day: 1400      # stay under free-tier RPD by design
  # PRIVACY: free tier may train on submitted data. See CLAUDE.md LLM caveat.

resume:
  master_tex_path: "resume/master.tex"   # your modular master LaTeX resume
  output_dir: "data/resumes"             # compiled tailored PDFs land here
  latex_compiler: "latexmk"              # or "pdflatex"

automation:
  headless: false                 # run headed under xvfb on the server
  use_stealth: true
  storage_state_dir: "data/auth_state"   # Playwright persistent context (cookies/session)
  form_timeout_minutes: 10

auth:
  google_account_email: ""        # designated (ideally BURNER) Google account for OAuth
  application_email: ""           # email used for OTP-based registration/login
  otp_timeout_minutes: 15         # Goal 7 default

storage:
  db_path: "data/cvflow.db"               # SQLite application-tracking store (Goal 9)
  form_fields_path: "profile/form_fields.json"

security:
  fernet_key_path: "data/.fernet_key"     # encryption key for tokens/cookies; chmod 600, never commit

profile:
  knowledge_base_dir: "profile"   # all *.md loaded in full as LLM context
