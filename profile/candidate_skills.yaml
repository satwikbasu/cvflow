# Curated, machine-readable skill set for the deterministic must-have gate
# (src/cvflow/discovery/skills.py). PII, no secrets — committed per CLAUDE.md
# invariant 5. Hand-maintained: add a skill here the moment it becomes real, so
# the gate stops dropping jobs that need it. Matching is exact (after lowercasing
# + synonym resolution), NOT substring — list each concrete tool you actually know.
#
# Source of truth for the prose version: profile/skills.md + experience.md.

skills:
