  - python
  - java
  - go
  # Web / API
  - flask
  - rest
  # Networking & security
  - http
  - tcp/ip
  - snmp
  - ipsec
  - firewall
  - nat
  - dns
  - strongswan
  # OS / scripting
  - linux
  - bash
  - systemd
  # Databases
  - mysql
  - postgresql
  # Containers / build / CI
  - docker
  - docker compose
  - docker swarm
  - maven
  - jenkins
  - ci/cd
  - git
  # Messaging / monitoring / cloud
  - kafka
  - opennms
  - snmpsim
  - grafana
  - oracle cloud

# alias (as it may appear in a JD's must-have list)  ->  canonical skill above
